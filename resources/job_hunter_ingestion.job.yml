# Milestone 1: LinkedIn job alerts (Gmail) → job descriptions → bronze tables.

resources:
  jobs:
    job_hunter_ingestion:
      name: job_hunter_ingestion
      max_concurrent_runs: 1

      # Daily at 08:00 Istanbul time. Paused automatically in dev (mode: development).
      schedule:
        quartz_cron_expression: "0 0 8 * * ?"
        timezone_id: Europe/Istanbul

      tasks:
        - task_key: ingest_emails
          python_wheel_task:
            package_name: job_hunter
            entry_point: ingest_emails
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${resources.schemas.medallion.name}"
              - "--secret-scope"
              - "${var.secret_scope}"
              - "--query"
              - "${var.gmail_query}"
          environment_key: default

        - task_key: fetch_postings
          depends_on:
            - task_key: ingest_emails
          python_wheel_task:
            package_name: job_hunter
            entry_point: fetch_postings
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${resources.schemas.medallion.name}"
              - "--max-postings"
              - "${var.max_postings_per_run}"
          environment_key: default

        - task_key: enrich_jobs
          depends_on:
            - task_key: fetch_postings
          python_wheel_task:
            package_name: job_hunter
            entry_point: enrich_jobs
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${resources.schemas.medallion.name}"
              - "--model"
              - "${var.llm_model}"
              - "--max-jobs"
              - "${var.max_enrich_per_run}"
          environment_key: default

        - task_key: process_cv
          # Independent of the job-ingestion chain; skips quickly when the CV file is unchanged.
          python_wheel_task:
            package_name: job_hunter
            entry_point: process_cv
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${resources.schemas.medallion.name}"
              - "--cv-path"
              - "/Volumes/${var.catalog}/${resources.schemas.medallion.name}/${resources.volumes.cv.name}/input/cv.pdf"
              - "--model"
              - "${var.llm_model}"
          environment_key: default

        - task_key: embed_jobs
          depends_on:
            - task_key: enrich_jobs
          python_wheel_task:
            package_name: job_hunter
            entry_point: embed_jobs
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${resources.schemas.medallion.name}"
          environment_key: default

        - task_key: match_jobs
          depends_on:
            - task_key: embed_jobs
            - task_key: process_cv
          python_wheel_task:
            package_name: job_hunter
            entry_point: match_jobs
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${resources.schemas.medallion.name}"
              - "--model"
              - "${var.llm_model}"
              - "--target-country"
              - "${var.target_country}"
              - "--remote-countries"
              - "${var.remote_countries}"
              - "--allowed-seniority"
              - "${var.allowed_seniority}"
              - "--max-age-days"
              - "${var.max_job_age_days}"
              - "--max-judge"
              - "${var.max_judge_per_run}"
              - "--priority-min-fit"
              - "${var.priority_min_fit}"
              - "--top-n"
              - "${var.top_n}"
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
