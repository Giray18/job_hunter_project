# The main pipeline for job_hunter

resources:
  pipelines:
    job_hunter_etl:
      name: job_hunter_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/job_hunter_etl"

      libraries:
        - glob:
            include: ../src/job_hunter_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
