# Milestone 6: Vector Search index over the stored job embeddings (prod only).
#
# Free Edition allows one Vector Search endpoint per workspace, so the endpoint and index exist only in prod.
# The index reuses silver_job_embeddings.embedding (self-managed embeddings), so no job is embedded twice.

targets:
  prod:
    resources:
      vector_search_endpoints:
        job_hunter_vs:
          name: job_hunter_vs
          # CAN_MANAGE for the runner and the maintainer comes from the prod target's permissions.
          endpoint_type: STANDARD

      vector_search_indexes:
        jobs_index:
          name: ${var.catalog}.${resources.schemas.medallion.name}.jobs_index
          endpoint_name: ${resources.vector_search_endpoints.job_hunter_vs.name}
          primary_key: job_id
          index_type: DELTA_SYNC
          # Vector + keyword search. The service defaults to HYBRID; leaving it unset makes every deploy plan a
          # recreate of the index.
          index_subtype: HYBRID
          # No columns_to_sync: all columns of the (small) source table are synced. The API doesn't return
          # columns_to_sync, so setting it also makes every deploy plan a recreate.
          delta_sync_index_spec:
            source_table: ${var.catalog}.${resources.schemas.medallion.name}.silver_job_embeddings
            pipeline_type: TRIGGERED
            embedding_vector_columns:
              - name: embedding
                embedding_dimension: 1024
          # Authoritative: these are the index's only object-level grants after a deploy, so the chat app's principal
          # is listed too (its app resource grant would otherwise be removed). It also inherits SELECT from the schema.
          grants:
            - principal: ${var.maintainer}
              privileges:
                - SELECT
            - principal: ${var.chat_app_sp}
              privileges:
                - SELECT

      jobs:
        job_hunter_ingestion:
          tasks:
            # Runs next to matching, so it never delays the daily applications.
            - task_key: sync_index
              depends_on:
                - task_key: embed_jobs
              python_wheel_task:
                package_name: job_hunter
                entry_point: sync_index
                parameters:
                  - "--index-name"
                  - "${resources.vector_search_indexes.jobs_index.name}"
              environment_key: default
