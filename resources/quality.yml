# Milestone 8: quality of the LLM outputs with MLflow 3 judges (prod only, like the chat app whose traces it scores).
#
# Weekly, separate from the daily pipeline:
# - evaluate_outputs: two LLM judges (fit-score calibration, cover-letter relevance) + format checks on the week's
#   applications → MLflow run in output_eval + gold_output_quality.
# - evaluate_chat: replays the chat turns the app saved in the chat_turns volume as MLflow traces, then scores
#   them with MLflow retrieval judges (groundedness, relevance, citations). The app can't trace live: its network
#   can't reach the storage MLflow uploads trace data to.

targets:
  prod:
    resources:
      volumes:
        chat_turns:
          # One JSON file per chat turn, written by the chat app (WRITE_VOLUME via its app resources).
          catalog_name: ${var.catalog}
          schema_name: ${resources.schemas.medallion.name}
          name: chat_turns
          volume_type: MANAGED
          comment: Chat app turns (<date>/<turn_id>.json), replayed as MLflow traces by job_hunter_quality.

      experiments:
        chat_traces:
          # Traces replayed from the chat_turns volume by evaluate_chat (one per chat turn).
          name: /Workspace/Users/${workspace.current_user.userName}/job_hunter_chat_traces
        output_eval:
          name: /Workspace/Users/${workspace.current_user.userName}/job_hunter_output_eval

      jobs:
        job_hunter_quality:
          name: job_hunter_quality
          max_concurrent_runs: 1
          schedule:
            quartz_cron_expression: "0 0 20 ? * SUN"
            timezone_id: Europe/Zagreb
          tasks:
            - task_key: evaluate_outputs
              python_wheel_task:
                package_name: job_hunter
                entry_point: evaluate_outputs
                parameters:
                  - "--catalog"
                  - "${var.catalog}"
                  - "--schema"
                  - "${resources.schemas.medallion.name}"
                  - "--experiment-id"
                  - "${resources.experiments.output_eval.id}"
                  - "--model"
                  - "${var.llm_model}"
                  - "--lookback-days"
                  - "${var.quality_lookback_days}"
              environment_key: eval
            - task_key: evaluate_chat
              python_wheel_task:
                package_name: job_hunter
                entry_point: evaluate_chat
                parameters:
                  - "--turns-dir"
                  - "/Volumes/${var.catalog}/${resources.schemas.medallion.name}/${resources.volumes.chat_turns.name}"
                  - "--experiment-id"
                  - "${resources.experiments.chat_traces.id}"
                  - "--model"
                  - "${var.llm_model}"
              environment_key: eval
          environments:
            - environment_key: eval
              spec:
                environment_version: "5"
                dependencies:
                  - ../dist/*.whl
                  - mlflow[databricks]>=3.8,<4
