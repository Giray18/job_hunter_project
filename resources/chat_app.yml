# Milestone 7: Streamlit chat app over the jobs (prod only, like the Vector Search index it queries).
#
# `bundle deploy` creates/updates the app and its permissions; it does not start it. Start it when needed with the
# "Run workflow" button (run_chat_app) or `databricks apps start job-hunter-chat`. Free Edition stops apps after 24h.

targets:
  prod:
    resources:
      apps:
        job_hunter_chat:
          name: job-hunter-chat
          description: Ask questions about the job pipeline's jobs, browse them and download tailored documents.
          source_code_path: ../src/job_hunter_app
          # Replaces an app.yaml in the source folder, so the names below can come from bundle variables.
          # value_from refers to the resource names below.
          config:
            command: ["streamlit", "run", "app.py"]
            env:
              - name: DATABRICKS_WAREHOUSE_ID
                value_from: sql-warehouse
              - name: LLM_ENDPOINT
                value_from: llm
              - name: EMBEDDING_ENDPOINT
                value_from: embeddings
              - name: JOB_HUNTER_CATALOG
                value: ${var.catalog}
              - name: JOB_HUNTER_SCHEMA
                value: ${var.schema}
              - name: JOB_HUNTER_INDEX
                value: ${var.catalog}.${var.schema}.jobs_index
              # Chat turns are traced to this MLflow experiment (resources/quality.yml scores them weekly).
              - name: MLFLOW_TRACKING_URI
                value: databricks
              - name: MLFLOW_EXPERIMENT_ID
                value_from: chat-traces
          # The app's own service principal gets exactly these grants (read-only). Names use ${var.schema} rather
          # than the schema resource: the schema's grants refer to this app, and the reverse would be a cycle.
          # Granting them needs MANAGE on the catalog for the deploying identity (see README, one-time setup).
          resources:
            - name: sql-warehouse
              sql_warehouse:
                id: ${var.warehouse_id}
                permission: CAN_USE
            - name: llm
              serving_endpoint:
                name: ${var.llm_model}
                permission: CAN_QUERY
            - name: embeddings
              serving_endpoint:
                name: databricks-gte-large-en
                permission: CAN_QUERY
            - name: chat-traces
              experiment:
                experiment_id: ${resources.experiments.chat_traces.id}
                permission: CAN_EDIT
            - name: jobs-index
              uc_securable:
                securable_full_name: ${var.catalog}.${var.schema}.jobs_index
                securable_type: TABLE
                permission: SELECT
            - name: cv-volume
              uc_securable:
                securable_full_name: ${var.catalog}.${var.schema}.cv
                securable_type: VOLUME
                permission: READ_VOLUME
            - name: job-embeddings
              uc_securable:
                securable_full_name: ${var.catalog}.${var.schema}.silver_job_embeddings
                securable_type: TABLE
                permission: SELECT
            - name: jobs
              uc_securable:
                securable_full_name: ${var.catalog}.${var.schema}.silver_jobs
                securable_type: TABLE
                permission: SELECT
            - name: job-matches
              uc_securable:
                securable_full_name: ${var.catalog}.${var.schema}.gold_job_matches
                securable_type: TABLE
                permission: SELECT
            - name: applications
              uc_securable:
                securable_full_name: ${var.catalog}.${var.schema}.gold_applications
                securable_type: TABLE
                permission: SELECT
            - name: application-status
              uc_securable:
                securable_full_name: ${var.catalog}.${var.schema}.gold_application_status
                securable_type: TABLE
                permission: SELECT
