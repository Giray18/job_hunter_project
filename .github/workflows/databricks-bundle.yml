name: Databricks bundle CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      auto_approve:
        description: "Approve destructive changes (deleting pipelines, schemas, volumes). Review the failed plan first."
        type: boolean
        default: false
      run_chat_app:
        description: "Deploy the latest chat app code and start the app (it stops by itself after 24h)."
        type: boolean
        default: false

concurrency:
  group: databricks-bundle-${{ github.ref }}
  cancel-in-progress: false

env:
  # Authenticate as the 'runner' service principal (OAuth M2M).
  DATABRICKS_HOST: https://dbc-d12bb884-312f.cloud.databricks.com
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
  # Fills ${var.maintainer} in databricks.yml without storing the email in the repo.
  BUNDLE_VAR_maintainer: ${{ secrets.DATABRICKS_MAINTAINER }}

jobs:
  validate:
    name: Validate bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate --strict -t prod
      # Shows what a merge would deploy; recreate/delete lines here make the post-merge deploy fail.
      - run: databricks bundle plan -t prod

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # Tests marked `databricks` need a live workspace (Databricks Connect) and are skipped in CI.
      - run: uv run pytest -m "not databricks"

  deploy:
    name: Deploy to prod
    needs: [validate, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: databricks/setup-cli@main
      # Deletions of data assets need an explicit manual run with auto_approve; pushes never approve them.
      - run: databricks bundle deploy -t prod ${{ inputs.auto_approve && '--auto-approve' || '' }}
      # The chat app is started only on request (Free Edition limits app runtime and compute).
      - if: inputs.run_chat_app
        run: databricks bundle run job_hunter_chat -t prod
      # Optional: trigger the job right after deploying (it also runs daily on its own trigger).
